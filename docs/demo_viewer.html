<!doctype html><meta charset="utf-8"><title>Quantum Cloud Replay</title>
<style>body{font:16px system-ui;margin:30px;background:#f4f6f8;color:#182b3a}h1{font-size:26px}select,button,input{padding:8px;margin:4px}table{border-collapse:collapse;width:100%;background:white;margin:12px 0}td,th{padding:9px;border:1px solid #ccd4dd;text-align:left}.picked{background:#cfebdf}section{background:white;padding:18px;margin:15px 0;border-radius:10px}.note{max-width:1000px;color:#45586a}b{color:#05614e}</style>
<h1>Quantum Cloud Task Placement</h1><p class="note">Replay được tính từ model đã lưu, không train trong trình duyệt. Một workload minh họa hành vi; kết luận thống kê lấy từ bộ 10 seed ×200 workload. T là giây mô phỏng; F và f_rel là proxy.</p>
<label>Case <select id="case"></select></label><label>Policy <select id="policy"></select></label><button id="prev">← Task</button><button id="next">Task →</button><button id="play">Chạy / Dừng</button><input id="step" type="range" min="0" value="0"><div id="info"></div><div id="content"></div>
<script>
const DATA=/*REPLAY_DATA*/ null;let timer=null;const by=id=>document.getElementById(id),fmt=x=>x===null?'—':Number(x).toFixed(4);function c(){return DATA.cases[by('case').selectedIndex]}function p(){return c().policies[by('policy').selectedIndex]}function draw(){let k=+by('step').value,t=p().trace[k];by('info').textContent=`Training seed ${DATA.train_seed}; workload seed ${DATA.workload_seed}; task ${k+1}/${p().trace.length}; width ${t.width}; node ${t.chosen}; reward ${fmt(t.reward)}; T ${fmt(t.T)} s`;by('content').innerHTML='<table><tr><th>Node</th><th>Khả thi</th><th>Queue</th><th>Wait s</th><th>Exec s</th><th>f_rel</th></tr>'+t.nodes.map(n=>`<tr class="${n.name===t.chosen?'picked':''}"><td>${n.name}</td><td>${n.feasible}</td><td>${n.qlen}</td><td>${fmt(n.wait)}</td><td>${fmt(n.exec)}</td><td>${fmt(n.frel)}</td></tr>`).join('')+'</table><h2>Kết quả của cả workload này</h2><table><tr><th>Policy</th><th>Score</th><th>Mean T s</th><th>Wait s</th><th>F proxy</th><th>f_rel</th></tr>'+c().policies.map(x=>`<tr><td>${x.name}</td><td>${fmt(x.metrics.score)}</td><td>${fmt(x.metrics.mean_T)}</td><td>${fmt(x.metrics.mean_wait)}</td><td>${fmt(x.metrics.mean_F)}</td><td>${fmt(x.metrics.mean_frel)}</td></tr>`).join('')+'</table><p>Các policy có cùng task/thời điểm đến, nhưng trạng thái queue trên quỹ đạo riêng có thể khác nhau. Chọn policy để xem quỹ đạo tương ứng.</p>';}
function policies(){by('policy').innerHTML=c().policies.map(x=>`<option>${x.name}</option>`).join('');reset()}function reset(){by('step').max=p().trace.length-1;by('step').value=0;draw()}function move(n){by('step').value=Math.max(0,Math.min(p().trace.length-1,+by('step').value+n));draw()}
if(DATA){by('case').innerHTML=DATA.cases.map(x=>`<option>${x.name}</option>`).join('');by('case').onchange=policies;by('policy').onchange=reset;by('step').oninput=draw;by('prev').onclick=()=>move(-1);by('next').onclick=()=>move(1);by('play').onclick=()=>{if(timer){clearInterval(timer);timer=null}else timer=setInterval(()=>{move(1);if(+by('step').value===p().trace.length-1){clearInterval(timer);timer=null}},700)};policies()}else by('content').textContent='Template: tạo replay bằng demo_saved_models.py trước khi mở.';
</script>
